website:
  description: "Simply Rational ist eine Ausgründung aus dem Max-Planck-Institut für Bildungsforschung, einer weltweit führenden Institution für die Erforschung von Entscheidungsstrategien. Co-Founder Prof. Gerd Gigerenzer ist einer der meistzitierten Psychologen weltweit.
Unsere Arbeit basiert auf nobelpreisprämierten Ansätzen aus Data Science, Behavioral Science und Organisationsentwicklung. Durch die Verbindung menschlicher und künstlicher Intelligenz schaffen wir erfolgreiche Lösungen für komplexe Entscheidungssituationen."
  site-url: https://simply-rational-gmbh.github.io/datascienceblog/ 
  title: "Data Science Blog"
  search: false
  navbar:
    background: "#FFF5EB"
    foreground: "#020202"
    title: false
    right:
      - text: "DE"
        href: index.qmd
      - text: "EN"
      - text: "Gute Entscheidung"
        href: "mailto:GuteEntscheidung@simplyrational.de"

