meta:
  name: Simply Rational GmbH
  link: https://www.simplyrational.de

color:
  palette:
    trust_black: "#020202"
    foreground: "#020202"
    guiding_canvas: "#FFF5EB"
    background: "#FFF5EB"
    rational_berry: "#661AAE"
    primary: "#661AAE"
    system_white: "#EFEFEF"
    signal_teal: "#1AA7B4"
    secondary: "#020202"
    active_orange: "#EA5A0C"
    decision_green: "#0BA940"
    insight_gold: "#F3D006"
    data_magenta: "#C00D46"
    signal_red: "#E30C10"
    system_blue: "#174CBF"
    strategic_plum: "#5A4271"
    structured_olive: "#82800A"
    fresh_mint: "#3BD8AE"
    
  background: guiding_canvas 
  foreground: trust_black
  primary: rational_berry
  secondary: trust_black

logo: 
  medium: simply-rational-logo.webp

typography:
  fonts:
    - family: Noto Serif JP
      source: google
    - family: Bricolage Grotesque
      source: google
  base: Bricolage Grotesque
  headings: Noto Serif JP

defaults:
  bootstrap:
    rules: |
      #quarto-document-content h2 {
        border-bottom: none;
        padding-bottom: 0.6rem;
        position: relative;
      }
      #quarto-document-content h2::after {
        content: "";
        position: absolute;
        left: 0;
        right: 8px;
        bottom: 0.3rem;
        height: 2px;
        background-color: $primary;
      }
      #quarto-document-content h2::before {
        content: "";
        position: absolute;
        right: 0;
        bottom: calc(0.3rem - 3px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: $primary;
      }
